# Nothing gets installed on your machine: Postgres and Atlas run as containers
# here (and GitHub Actions runs the same containers in CI).
#   postgres   local databases for your services - scripts/db.sh starts it
#   atlas      the Atlas CLI, run by scripts/db.sh
#   atlas-dev  empty throwaway Postgres Atlas uses to compute migrations
services:
  postgres:
    image: postgres:${POSTGRES_VERSION:-16}
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck: &pg_ready
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 30

  atlas:
    image: arigaio/atlas:1.3.3-community
    profiles: [tools]
    user: "${HOST_UID:-0}:${HOST_GID:-0}"
    environment:
      HOME: /tmp
    working_dir: /work
    volumes:
      - .:/work
    extra_hosts:
      - host.docker.internal:host-gateway

  atlas-dev:
    image: postgres:${POSTGRES_VERSION:-16}
    profiles: [tools]
    environment:
      POSTGRES_PASSWORD: postgres
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck: *pg_ready

volumes:
  postgres_data:
