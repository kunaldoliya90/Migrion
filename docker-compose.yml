# Everything runs in Docker - there's nothing else to install.
#   postgres   your local databases (localhost:5432 from your machine)
#   atlas      the Atlas CLI, run by scripts/db.sh
#   atlas-dev  an empty Postgres Atlas uses as scratch space to compute migrations
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck: &ready
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 1s
      retries: 30

  atlas-dev:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck: *ready

  atlas:
    image: arigaio/atlas:1.3.3-community
    profiles: [tools]
    user: "${HOST_UID:-0}:${HOST_GID:-0}"
    environment:
      HOME: /tmp
    working_dir: /work
    volumes:
      - .:/work
    depends_on:
      atlas-dev:
        condition: service_healthy

volumes:
  postgres_data:
