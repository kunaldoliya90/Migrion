name: CD

on:
  push:
    branches: [main]
    paths: ["database/**"]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Load the *_DATABASE_URL secrets
        env:
          SECRETS: ${{ toJSON(secrets) }}
        run: jq -r 'to_entries[] | select(.key | endswith("_DATABASE_URL")) | "\(.key)=\(.value)"' <<< "$SECRETS" >> "$GITHUB_ENV"

      - name: Migrate production
        run: make db-migrate-prod
