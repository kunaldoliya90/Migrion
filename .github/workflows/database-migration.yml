name: Database Migration

# Atlas runs here (and in local Docker) - it's never installed on anyone's machine.
#
# Push to a branch:  generate migrations for schema.hcl changes and commit them
#                    back to the branch (what `make db-sync` waits for).
# Pull request:      verify branch name, conventions, history and schema/migration sync.
# Push to main:      verify, then migrate DB_PUSH_ENVIRONMENT (repo variable, default production).
# Manual run:        verify the chosen branch; on main, also migrate the chosen environment.
# Each GitHub Environment holds one <NAME>_DATABASE_URL secret per database.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths: ["database/**", "atlas.hcl", "scripts/db.sh", "docker-compose.yml", "Makefile", ".env.example"]
  push:
    paths: ["database/**", "atlas.hcl", "scripts/db.sh", "docker-compose.yml"]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to migrate (main only; leave empty to just verify)
        type: environment
        required: false

permissions:
  contents: read

jobs:
  generate:
    if: github.event_name == 'push' && github.ref_name != github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    concurrency:
      group: db-generate-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - name: Generate migrations
        run: make db-migration

      - name: Commit them back to the branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -n "$(git status --porcelain database)" ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add database
          git commit -m "db: generate migrations"
          git push
          gh workflow run database-migration.yml --ref "$GITHUB_REF_NAME"

  verify:
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event_name == 'push' && github.event.before || github.ref_name != github.event.repository.default_branch && format('origin/{0}', github.event.repository.default_branch) || '' }}
          DB_BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || github.event_name == 'workflow_dispatch' && github.ref_name != github.event.repository.default_branch && github.ref_name || '' }}
          ALLOW_DESTRUCTIVE: ${{ github.event_name == 'pull_request' && (contains(github.event.pull_request.labels.*.name, 'allow-destructive-migration') && 'true' || 'false') || github.event_name == 'workflow_dispatch' && github.ref_name != github.event.repository.default_branch && 'lookup' || '' }}
        run: make db-verify BASE="$BASE"

  migrate:
    needs: verify
    if: >-
      github.ref_name == github.event.repository.default_branch &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.environment != ''))
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || vars.DB_PUSH_ENVIRONMENT || 'production' }}
    concurrency:
      group: db-migrate-${{ inputs.environment || vars.DB_PUSH_ENVIRONMENT || 'production' }}
      cancel-in-progress: false
    env:
      DB_ENV: ${{ inputs.environment || vars.DB_PUSH_ENVIRONMENT || 'production' }}
    steps:
      - uses: actions/checkout@v4

      - name: Load this environment's *_DATABASE_URL secrets
        env:
          SECRETS: ${{ toJSON(secrets) }}
        run: jq -r 'to_entries[] | select(.key | endswith("_DATABASE_URL")) | "\(.key)=\(.value)"' <<< "$SECRETS" >> "$GITHUB_ENV"

      - name: Migrate
        run: make db-migrate ENV="$DB_ENV"
